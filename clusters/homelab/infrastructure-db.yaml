apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-db
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/base/supabase
  prune: true
  wait: true
  timeout: 20m   # Supabase's first boot initialises the database before the APIs come up
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-core
  decryption:
    provider: sops
    secretRef:
      name: sops-age
