apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/seanpe-com
  - ../base/seanpe-api
  - ../base/bookorbit
namespace: apps

images:
  - name: seanpe11/seanpe-com
    newName: seanpe11/seanpe-com
    newTag: "v1.0.2"
  - name: seanpe11/seanpe-api
    newTag: "efb2492"   # seanpe11/seanpe-api@efb2492 — X-API-Key on writes, swagger regenerated
  - name: ghcr.io/bookorbit/bookorbit
    newTag: "3.3.0"   # 2026-10-07. Moves fast: read release notes before bumping
  - name: pgvector/pgvector
    newTag: "0.8.7-pg18"   # what upstream compose's pg18 resolves to; a major bump needs a dump/restore
