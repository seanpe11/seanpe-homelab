apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/seanpe-com
  - ../base/seanpe-api
  - ../base/grafana
namespace: apps

images:
  - name: seanpe11/seanpe-com
    newName: seanpe11/seanpe-com
    newTag: "v1.0.2"
  - name: seanpe11/seanpe-api
    newTag: "49d9a94"   # seanpe11/seanpe-api@49d9a94 — poker drill pack routes, CORS for the PWA

# Grafana is a HelmRelease, so `images:` can't reach it: pin chart + image here.
patches:
  - target: { kind: HelmRelease, name: grafana }
    patch: |
      - op: replace
        path: /spec/chart/spec/version
        value: "14.3.1"
      - op: add
        path: /spec/values/image
        value: { repository: grafana/grafana, tag: "13.3.0-distroless" }
