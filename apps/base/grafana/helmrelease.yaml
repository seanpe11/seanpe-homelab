                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "with w as (\n  -- window starts at the first beat (the agent didn't exist before), or when the host was added if it never beat\n  select h.host, h.expected_interval_s,\n         greatest(now() - interval '7 days',\n                  coalesce((select min(sampled_at) from gf.host_samples f where f.host = h.host), h.added_at)) as since\n  from gf.hosts h\n), beats as (\n  select w.host, count(distinct date_trunc('minute', x.sampled_at)) as n\n  from w left join gf.host_samples x on x.host = w.host and x.sampled_at >= w.since group by w.host\n), boots as (\n  select host, count(*) filter (where prev is not null and boot_time <> prev) as reboots\n  from (select host, boot_time, lag(boot_time) over (partition by host order by sampled_at) as prev\n        from gf.host_samples where sampled_at > now() - interval '7 days') b group by host\n)\nselect s.host as \"Host\",\n       case when s.last_beat is not null and now() - s.last_beat < make_interval(secs => 3 * s.expected_interval_s) then 1 else 0 end as \"Status\",\n       s.uptime_s + extract(epoch from now() - s.last_beat) as \"Uptime\",\n       s.load1 as \"Load (1 min)\",\n       s.mem_used_pct as \"Memory used\",\n       s.disk_root_pct as \"Root disk used\",\n       least(100, 100.0 * b.n / greatest(1, extract(epoch from now() - w.since) / w.expected_interval_s)) as \"Agent reachability (7 d)\",\n       coalesce(r.reboots, 0) as \"Reboots (7 d)\"\nfrom gf.host_status s join w using (host) join beats b using (host) left join boots r using (host)\norder by s.host"
                    }
                  ],
                  "description": "Agent reachability = minutes with a heartbeat / minutes expected, since the host's first heartbeat (max 7 days). It measures whether the agent reached the database, which is a lower bound on uptime, not uptime itself.",
