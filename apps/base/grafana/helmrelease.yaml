# Grafana over the Supabase Postgres, two hostnames (cloudflared, infrastructure/base/cloudflared):
#   grafana.seanpe.io     whole host behind Cloudflare Access - Sean only
#   dashboards.seanpe.io  public, but cloudflared passes ONLY shared-dashboard paths; the rest 404s
# Shared (public) dashboards, NOT auth.anonymous: anonymous would expose the datasource query API.
# The datasource logs in as grafana_ro (ops/sql/grafana_ro.sql): SELECT on dashboard tables only.
# Chart version and image tag are pinned in apps/production/kustomization.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: 0.0.0   # overlay
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    testFramework:
      enabled: false
    deploymentStrategy:
      type: Recreate   # sqlite on a RWO volume: never two pods at once
    persistence:
      enabled: true
      storageClassName: local-path
      size: 1Gi   # a label on local-path, not a quota
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

    admin:
      existingSecret: grafana-secrets   # admin-user / admin-password
    envValueFrom:
      GRAFANA_RO_PASSWORD:
        secretKeyRef: { name: grafana-secrets, key: GRAFANA_RO_PASSWORD }
    env:
      # Grafana's default CSP template (13.3 defaults.ini) + frame-ancestors, which is what actually
      # limits who may iframe us now that allow_embedding drops X-Frame-Options. seanpe.io and its
      # subdomains only - NOT *.pages.dev, which anyone can publish to. Passed as env, not grafana.ini:
      # the ini parser would treat the ';'s as comments. Verified 2026-11-05: an allowed origin
      # embeds, any other gets "Refused to frame", and the shared page still renders with CSP on.
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data: blob:;base-uri 'self';connect-src 'self' grafana.com *.cartocdn.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self' $FORM_ACTION_ADDITIONAL_HOSTS;frame-ancestors 'self' https://seanpe.io https://*.seanpe.io;

    grafana.ini:
      server:
        domain: grafana.seanpe.io
        # Private host on purpose: login redirects must stay on it. Share links Grafana shows
        # will say grafana.seanpe.io - hand them out as dashboards.seanpe.io instead.
        # The public page only carries this in boot JSON; <base href> stays "/" (verified on 13.3).
        root_url: https://grafana.seanpe.io
      security:
        cookie_secure: true
        disable_gravatar: true
        # For embedding shared dashboards in seanpe.io (Cloudflare Pages). Without this Grafana sends
        # X-Frame-Options: deny and the iframe is blank. Instance-wide, so the CSP frame-ancestors
        # above is the real limit. A shared dashboard embeds whole: ?viewPanel and ?kiosk are ignored
        # on /public-dashboards (verified 13.3), so the pattern is one small dashboard per widget.
        allow_embedding: true
        content_security_policy: true
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
      public_dashboards:
        enabled: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
        feedback_links_enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources: []
        datasources:
          - name: Supabase
            uid: supabase-pg
            type: grafana-postgresql-datasource
            access: proxy
            isDefault: true
            url: supabase-supabase-db.supabase.svc.cluster.local:5432
            user: grafana_ro
            jsonData:
              database: postgres
              sslmode: disable   # in-cluster only
              postgresVersion: 1700
              timescaledb: false
            secureJsonData:
              password: ${GRAFANA_RO_PASSWORD}
            editable: false

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            folder: Provisioned
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        # Widget for the seanpe.io homelab card. Embed at >= 800 px wide x 240 px tall (tiles plus the
        # hardware line): narrower than ~790 px and Grafana's mobile layout stacks the tiles.
        homelab-card:
          json: |
            {
              "uid": "homelab-card",
              "title": "Homelab",
              "description": "Widget for the seanpe.io homelab card: one row, embedded as an iframe.",
              "schemaVersion": 41,
              "time": {
                "from": "now-24h",
                "to": "now"
              },
              "refresh": "1m",
              "panels": [
                {
                  "id": 1,
                  "type": "stat",
                  "title": "Collectors OK",
                  "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 6,
                    "h": 3
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select count(*) filter (where extract(epoch from now() - c.last_beat) / coalesce(e.expected_interval_s, 60) < 2)\n       || ' / ' || count(*) as shown\nfrom pab_collector_status c left join gf.collector_expectations e using (instance)\nwhere c.instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^shown$/",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "value",
                    "justifyMode": "center"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "noValue": "\u2014",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "mappings": [
                        {
                          "type": "regex",
                          "options": {
                            "pattern": "^(\\d+) / \\1$",
                            "result": {
                              "color": "green",
                              "index": 0
                            }
                          }
                        },
                        {
                          "type": "regex",
                          "options": {
                            "pattern": "^0 / ",
                            "result": {
                              "color": "red",
                              "index": 1
                            }
                          }
                        }
                      ],
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "#EAB839"
                      }
                    },
                    "overrides": []
                  },
                  "description": "Prediction-market collectors whose last heartbeat is within twice their normal interval."
                },
                {
                  "id": 2,
                  "type": "stat",
                  "title": "Hosts up",
                  "gridPos": {
                    "x": 6,
                    "y": 0,
                    "w": 6,
                    "h": 3
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select count(*) filter (where (s.last_beat is not null and now() - s.last_beat < make_interval(secs => 3 * s.expected_interval_s))) || ' / ' || count(*) as shown from gf.host_status s"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^shown$/",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "value",
                    "justifyMode": "center"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "noValue": "\u2014",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "mappings": [
                        {
                          "type": "regex",
                          "options": {
                            "pattern": "^(\\d+) / \\1$",
                            "result": {
                              "color": "green",
                              "index": 0
                            }
                          }
                        },
                        {
                          "type": "regex",
                          "options": {
                            "pattern": "^0 / ",
                            "result": {
                              "color": "red",
                              "index": 1
                            }
                          }
                        }
                      ],
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "#EAB839"
                      }
                    },
                    "overrides": []
                  },
                  "description": "Homelab hosts whose heartbeat agent reported in the last 3 minutes."
                },
                {
                  "id": 3,
                  "type": "stat",
                  "title": "rocinante uptime",
                  "gridPos": {
                    "x": 12,
                    "y": 0,
                    "w": 6,
                    "h": 3
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select case when (s.last_beat is not null and now() - s.last_beat < make_interval(secs => 3 * s.expected_interval_s)) then s.uptime_s + extract(epoch from now() - s.last_beat) end as shown\nfrom gf.host_status s where s.host = 'rocinante'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^shown$/",
                      "values": false
                    },
                    "colorMode": "none",
                    "graphMode": "none",
                    "textMode": "value",
                    "justifyMode": "center"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "noValue": "down",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "unit": "dtdurations"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 4,
                  "type": "stat",
                  "title": "Agent reach (7 d)",
                  "gridPos": {
                    "x": 18,
                    "y": 0,
                    "w": 6,
                    "h": 3
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select least(100, 100.0 * count(distinct date_trunc('minute', x.sampled_at))\n         / greatest(1, extract(epoch from now() - min(x.sampled_at)) / 60)) as shown\nfrom gf.host_samples x where x.host = 'rocinante' and x.sampled_at > now() - interval '7 days'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^shown$/",
                      "values": false
                    },
                    "colorMode": "none",
                    "graphMode": "none",
                    "textMode": "value",
                    "justifyMode": "center"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "noValue": "\u2014",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "unit": "percent",
                      "decimals": 1
                    },
                    "overrides": []
                  },
                  "description": "rocinante: minutes with a heartbeat / minutes expected over the last 7 days. Measures the agent reaching the database, a lower bound on uptime."
                },
                {
                  "id": 5,
                  "type": "stat",
                  "title": "",
                  "transparent": true,
                  "gridPos": {
                    "x": 0,
                    "y": 3,
                    "w": 24,
                    "h": 1
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "description": "rocinante's CPU, GPU and RAM: model and utilisation at its last heartbeat.",
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "time_series",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select now() as time, 'rocinante \u00b7 ' || coalesce(s.hw, 'no hardware report yet') as line, 0 as value from gf.host_status s where s.host = 'rocinante'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "none",
                    "graphMode": "none",
                    "textMode": "name",
                    "justifyMode": "center",
                    "text": {
                      "titleSize": 13
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "displayName": "${__field.labels.line}",
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "text"
                      }
                    },
                    "overrides": []
                  }
                }
              ]
            }
        pipeline-health:
          json: |
            {
              "uid": "pipeline-health",
              "title": "Pipeline health",
              "description": "Liveness of the prediction-market collectors and the homelab hosts.",
              "schemaVersion": 41,
              "time": {
                "from": "now-24h",
                "to": "now"
              },
              "refresh": "1m",
              "panels": [
                {
                  "id": 100,
                  "type": "row",
                  "title": "Collectors",
                  "collapsed": false,
                  "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 24,
                    "h": 1
                  },
                  "panels": []
                },
                {
                  "id": 1,
                  "type": "stat",
                  "title": "Collectors on schedule",
                  "gridPos": {
                    "x": 0,
                    "y": 1,
                    "w": 6,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select count(*) filter (where extract(epoch from now() - c.last_beat) / coalesce(e.expected_interval_s, 60) < 2) as on_schedule from pab_collector_status c\nleft join gf.collector_expectations e using (instance)\nwhere c.instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "auto",
                    "justifyMode": "center",
                    "orientation": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red",
                            "value": null
                          },
                          {
                            "color": "#EAB839",
                            "value": 1
                          },
                          {
                            "color": "green",
                            "value": 6
                          }
                        ]
                      },
                      "mappings": [],
                      "noValue": "\u2014"
                    },
                    "overrides": []
                  },
                  "description": "Collectors whose last heartbeat is within twice their normal interval."
                },
                {
                  "id": 2,
                  "type": "stat",
                  "title": "Most overdue",
                  "gridPos": {
                    "x": 6,
                    "y": 1,
                    "w": 6,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select max(extract(epoch from now() - c.last_beat) / coalesce(e.expected_interval_s, 60)) as overdue from pab_collector_status c\nleft join gf.collector_expectations e using (instance)\nwhere c.instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "auto",
                    "justifyMode": "center",
                    "orientation": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "mappings": [
                        {
                          "type": "range",
                          "options": {
                            "from": 0,
                            "to": 2,
                            "result": {
                              "text": "OK",
                              "color": "green"
                            }
                          }
                        },
                        {
                          "type": "range",
                          "options": {
                            "from": 2,
                            "to": 10,
                            "result": {
                              "text": "LATE",
                              "color": "#EAB839"
                            }
                          }
                        },
                        {
                          "type": "range",
                          "options": {
                            "from": 10,
                            "to": 1000000000000.0,
                            "result": {
                              "text": "STALE",
                              "color": "red"
                            }
                          }
                        }
                      ],
                      "noValue": "\u2014",
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "description": "The worst collector's heartbeat age, in multiples of its normal interval. OK under 2x, LATE under 10x."
                },
                {
                  "id": 3,
                  "type": "stat",
                  "title": "Rows collected, all time",
                  "gridPos": {
                    "x": 12,
                    "y": 1,
                    "w": 12,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select sum(c.total_rows) as rows from pab_collector_status c\nleft join gf.collector_expectations e using (instance)\nwhere c.instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "none",
                    "graphMode": "none",
                    "textMode": "auto",
                    "justifyMode": "center",
                    "orientation": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "mappings": [],
                      "noValue": "\u2014",
                      "unit": "short"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 4,
                  "type": "stat",
                  "title": "Heartbeat by collector",
                  "gridPos": {
                    "x": 0,
                    "y": 5,
                    "w": 24,
                    "h": 5
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "time_series",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select now() as time, c.instance, gf.ago(extract(epoch from now() - c.last_beat)) || ' ago' as ago, extract(epoch from now() - c.last_beat) / coalesce(e.expected_interval_s, 60) as value\nfrom pab_collector_status c\nleft join gf.collector_expectations e using (instance)\nwhere c.instance <> 'selftest' order by c.instance"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "value_and_name",
                    "justifyMode": "center",
                    "orientation": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      },
                      "mappings": [
                        {
                          "type": "range",
                          "options": {
                            "from": 0,
                            "to": 2,
                            "result": {
                              "text": "OK",
                              "color": "green"
                            }
                          }
                        },
                        {
                          "type": "range",
                          "options": {
                            "from": 2,
                            "to": 10,
                            "result": {
                              "text": "LATE",
                              "color": "#EAB839"
                            }
                          }
                        },
                        {
                          "type": "range",
                          "options": {
                            "from": 10,
                            "to": 1000000000000.0,
                            "result": {
                              "text": "STALE",
                              "color": "red"
                            }
                          }
                        }
                      ],
                      "noValue": "\u2014",
                      "displayName": "${__field.labels.instance} \u00b7 ${__field.labels.ago}"
                    },
                    "overrides": []
                  },
                  "description": "Each collector against its own cadence (most beat every minute, kalshi_wx and pcs_rounds every 5). OK = within 2 intervals, LATE = within 10, STALE beyond."
                },
                {
                  "id": 5,
                  "type": "timeseries",
                  "title": "Ingest rate by collector (rows/min, 10-min buckets)",
                  "gridPos": {
                    "x": 0,
                    "y": 10,
                    "w": 24,
                    "h": 9
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "description": "Growth in each collector's total row count, sampled every minute.",
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "time_series",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "with d as (\n  select sampled_at, instance,\n         greatest(total_rows - lag(total_rows) over (partition by instance order by sampled_at), 0) as delta\n  from gf.collector_samples\n  where $__timeFilter(sampled_at) and instance <> 'selftest'\n)\nselect $__timeGroupAlias(sampled_at, '10m'), instance as metric, sum(delta) / 10.0 as value\nfrom d where delta is not null\ngroup by 1, 2 order by 1"
                    }
                  ],
                  "options": {
