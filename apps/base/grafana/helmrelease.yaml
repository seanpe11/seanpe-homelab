# Grafana over the Supabase Postgres, two hostnames (cloudflared, infrastructure/base/cloudflared):
#   grafana.seanpe.io     whole host behind Cloudflare Access - Sean only
#   dashboards.seanpe.io  public, but cloudflared passes ONLY shared-dashboard paths; the rest 404s
# Shared (public) dashboards, NOT auth.anonymous: anonymous would expose the datasource query API.
# The datasource logs in as grafana_ro (ops/sql/grafana_ro.sql): SELECT on dashboard tables only.
# Chart version and image tag are pinned in apps/production/kustomization.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: 0.0.0   # overlay
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    testFramework:
      enabled: false
    deploymentStrategy:
      type: Recreate   # sqlite on a RWO volume: never two pods at once
    persistence:
      enabled: true
      storageClassName: local-path
      size: 1Gi   # a label on local-path, not a quota
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

    admin:
      existingSecret: grafana-secrets   # admin-user / admin-password
    envValueFrom:
      GRAFANA_RO_PASSWORD:
        secretKeyRef: { name: grafana-secrets, key: GRAFANA_RO_PASSWORD }

    grafana.ini:
      server:
        domain: grafana.seanpe.io
        # Private host on purpose: login redirects must stay on it. Share links Grafana shows
        # will say grafana.seanpe.io - hand them out as dashboards.seanpe.io instead.
        # The public page only carries this in boot JSON; <base href> stays "/" (verified on 13.3).
        root_url: https://grafana.seanpe.io
      security:
        cookie_secure: true
        disable_gravatar: true
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
      public_dashboards:
        enabled: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
        feedback_links_enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources: []
        datasources:
          - name: Supabase
            uid: supabase-pg
            type: grafana-postgresql-datasource
            access: proxy
            isDefault: true
            url: supabase-supabase-db.supabase.svc.cluster.local:5432
            user: grafana_ro
            jsonData:
              database: postgres
              sslmode: disable   # in-cluster only
              postgresVersion: 1700
              timescaledb: false
            secureJsonData:
              password: ${GRAFANA_RO_PASSWORD}
            editable: false

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            folder: Provisioned
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        pipeline-health:
          json: |
            {
              "uid": "pipeline-health",
              "title": "Pipeline health",
              "description": "Liveness of the prediction-market collectors writing into the homelab Postgres.",
              "schemaVersion": 41,
              "time": {
                "from": "now-24h",
                "to": "now"
              },
              "refresh": "1m",
              "panels": [
                {
                  "id": 1,
                  "type": "stat",
                  "title": "Collectors beating (< 2 min)",
                  "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 6,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select count(*) filter (where now() - last_beat < interval '2 minutes') as beating, count(*) as total from pab_collector_status where instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^beating$/",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "value"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red",
                            "value": null
                          },
                          {
                            "color": "#EAB839",
                            "value": 1
                          },
                          {
                            "color": "green",
                            "value": 6
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 2,
                  "type": "stat",
                  "title": "Oldest heartbeat",
                  "gridPos": {
                    "x": 6,
                    "y": 0,
                    "w": 6,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select extract(epoch from now() - min(last_beat)) as age from pab_collector_status where instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "background",
                    "graphMode": "none"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "s",
                      "decimals": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "#EAB839",
                            "value": 120
                          },
                          {
                            "color": "red",
                            "value": 600
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 3,
                  "type": "stat",
                  "title": "Rows collected, all time",
                  "gridPos": {
                    "x": 12,
                    "y": 0,
                    "w": 12,
                    "h": 4
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select sum(total_rows) as rows from pab_collector_status where instance <> 'selftest'"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "colorMode": "none",
                    "graphMode": "none"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "text",
                            "value": null
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 4,
                  "type": "stat",
                  "title": "Heartbeat age by collector",
                  "gridPos": {
                    "x": 0,
                    "y": 4,
                    "w": 24,
                    "h": 5
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "description": "Seconds since each collector last wrote its heartbeat. Green under 2 minutes, amber under 10, red beyond.",
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "table",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select instance, extract(epoch from now() - last_beat) as age from pab_collector_status where instance <> 'selftest' order by instance"
                    }
                  ],
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "/^age$/",
                      "values": true
                    },
                    "colorMode": "background",
                    "graphMode": "none",
                    "textMode": "value_and_name",
                    "orientation": "vertical"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "s",
                      "decimals": 0,
                      "displayName": "${__data.fields.instance}",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": null
                          },
                          {
                            "color": "#EAB839",
                            "value": 120
                          },
                          {
                            "color": "red",
                            "value": 600
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 5,
                  "type": "timeseries",
                  "title": "Ingest rate by collector (rows/min, 10-min buckets)",
                  "gridPos": {
                    "x": 0,
                    "y": 9,
                    "w": 24,
                    "h": 9
                  },
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "supabase-pg"
                  },
                  "description": "From gf.collector_samples: pg_cron snapshots pab_collector_status every minute; this is the growth in total_rows.",
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": {
                        "type": "grafana-postgresql-datasource",
                        "uid": "supabase-pg"
                      },
                      "format": "time_series",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "with d as (\n  select sampled_at, instance,\n         greatest(total_rows - lag(total_rows) over (partition by instance order by sampled_at), 0) as delta\n  from gf.collector_samples\n  where $__timeFilter(sampled_at) and instance <> 'selftest'\n)\nselect $__timeGroupAlias(sampled_at, '10m'), instance as metric, sum(delta) / 10.0 as value\nfrom d where delta is not null\ngroup by 1, 2 order by 1"
                    }
                  ],
                  "options": {
                    "legend": {
                      "displayMode": "table",
                      "placement": "right",
                      "calcs": [
                        "mean",
                        "max"
                      ]
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "custom": {
                        "drawStyle": "line",
                        "lineWidth": 2,
                        "fillOpacity": 10,
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              ]
            }
        quotes:
          json: |
            {
              "uid": "quotes",
              "title": "Quotes",
              "schemaVersion": 41,
              "time": { "from": "now-1y", "to": "now" },
              "panels": [
                {
                  "id": 1, "type": "barchart", "title": "Quotes by category",
                  "gridPos": { "x": 0, "y": 0, "w": 12, "h": 9 },
                  "datasource": { "type": "grafana-postgresql-datasource", "uid": "supabase-pg" },
                  "targets": [{
                    "refId": "A", "format": "table", "rawQuery": true, "editorMode": "code",
                    "datasource": { "type": "grafana-postgresql-datasource", "uid": "supabase-pg" },
                    "rawSql": "select coalesce(category, '(none)') as category, count(*) as quotes from spa_pkms_quotes group by 1 order by 2 desc"
                  }],
                  "options": { "orientation": "horizontal", "showValue": "always", "legend": { "showLegend": false } }
                },
                {
                  "id": 2, "type": "stat", "title": "Total quotes",
                  "gridPos": { "x": 12, "y": 0, "w": 6, "h": 9 },
                  "datasource": { "type": "grafana-postgresql-datasource", "uid": "supabase-pg" },
                  "targets": [{
                    "refId": "A", "format": "table", "rawQuery": true, "editorMode": "code",
                    "datasource": { "type": "grafana-postgresql-datasource", "uid": "supabase-pg" },
                    "rawSql": "select count(*) as quotes from spa_pkms_quotes"
                  }]
                }
              ]
            }
