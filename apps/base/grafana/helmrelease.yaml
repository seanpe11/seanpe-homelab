                      "format": "time_series",
                      "rawQuery": true,
                      "editorMode": "code",
                      "rawSql": "select now() as time, s.host,\n       case when (s.last_beat is not null and now() - s.last_beat < make_interval(secs => 3 * s.expected_interval_s)) then 'up ' || gf.ago(s.uptime_s + extract(epoch from now() - s.last_beat))\n            when s.last_beat is null then 'never seen'\n            else 'last seen ' || gf.ago(extract(epoch from now() - s.last_beat)) || ' ago' end as detail,\n       case when (s.last_beat is not null and now() - s.last_beat < make_interval(secs => 3 * s.expected_interval_s)) then 1 else 0 end as value\nfrom gf.host_status s order by s.host"
