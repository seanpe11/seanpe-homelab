# local-path volumes are directories on the VM disk: the size is a label, not a quota, and the
# class can't expand in place. The real ceiling is seanpe-homelab-1's free space.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books   # the book files themselves, plain EPUBs on disk. The thing to back up
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 7680Mi   # 7.5 GiB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-data    # covers, caches, the book bucket
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
