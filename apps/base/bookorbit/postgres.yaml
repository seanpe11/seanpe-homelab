# BookOrbit's own database, as upstream's compose ships it: Postgres 18 + pgvector (it also needs
# uuid-ossp and pg_trgm, both in contrib). Kept apart from Supabase so neither upgrade drags the
# other. NOT covered by ops/rocinante/pg-dump-pull - that only dumps Supabase.
apiVersion: v1
kind: Service
metadata:
  name: bookorbit-db
spec:
  clusterIP: None   # headless: the StatefulSet's stable DNS name
  selector:
    app: bookorbit-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookorbit-db
spec:
  serviceName: bookorbit-db
  replicas: 1
  selector:
    matchLabels:
      app: bookorbit-db
  template:
    metadata:
      labels:
        app: bookorbit-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector   # tag pinned in apps/production
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bookorbit
            - name: POSTGRES_DB
              value: bookorbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit
                  key: POSTGRES_PASSWORD
            # pg18's image moved its default data dir; keep upstream compose's layout instead.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
