# local-path volumes are directories on the VM disk: the size is a label, not a quota, and
# the class can't expand in place. The real ceiling is seanpe-homelab-1's free space.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cwa-library   # the Calibre library: metadata.db + book files. The thing to back up
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 7680Mi   # 7.5 GiB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cwa-config    # app.db (users, settings, KOSync progress) + /config/processed_books originals
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cwa-ingest    # drop zone: CWA imports then DELETES everything placed here
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
