apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volumes and SQLite: never two pods on one library
  selector:
    matchLabels:
      app: calibre-web-automated
  template:
    metadata:
      labels:
        app: calibre-web-automated
    spec:
      # No runAsNonRoot / readOnlyRootFilesystem: the image is s6-overlay, which starts as root,
      # chowns the volumes and drops to PUID:PGID itself.
      containers:
        - name: cwa
          image: crocodilestick/calibre-web-automated   # tag pinned in apps/production
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /calibre-library
            - name: ingest
              mountPath: /cwa-book-ingest
          startupProbe:          # first boot builds the library and backfills KOSync checksums
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /            # 302 to /login when up, which counts as success
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1536Mi     # ebook-convert on a big PDF or comic spikes well above idle
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cwa-config
        - name: library
          persistentVolumeClaim:
            claimName: cwa-library
        - name: ingest
          persistentVolumeClaim:
            claimName: cwa-ingest
