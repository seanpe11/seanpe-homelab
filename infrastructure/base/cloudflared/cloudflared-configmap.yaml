# Routes for tunnel seanpe-homelab-cluster (c61d839a-8683-4b67-8b4b-b120dfa434bc).
# A hostname also needs its DNS record (from rocinante or donnager, --config /dev/null is required):
#   cloudflared tunnel --config /dev/null route dns c61d839a-8683-4b67-8b4b-b120dfa434bc <hostname>
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: networking
data:
  config.yaml: |
    tunnel: c61d839a-8683-4b67-8b4b-b120dfa434bc
    credentials-file: /etc/cloudflared-creds/credentials.json
    ingress:
      - hostname: api.seanpe.io
        service: http://seanpe-api.apps.svc.cluster.local:80
      - hostname: portfolio.seanpe.io
        service: http://seanpe-com-service.apps.svc.cluster.local:80
      # Studio + everything else, behind Cloudflare Access (Kong has no password any more).
      - hostname: supabase.seanpe.io
        service: http://supabase-supabase-kong.supabase.svc.cluster.local:8000
      # db.seanpe.io is the PUBLIC API host: no Access in front of it, so route ONLY the API
      # paths. Everything else on this host - notably "/", which Kong maps to Studio - must 404,
      # or Studio would be on the internet unauthenticated. Allowlist, not denylist.
      - hostname: db.seanpe.io
        path: ^/(rest|auth|storage|realtime|functions|graphql)/
        service: http://supabase-supabase-kong.supabase.svc.cluster.local:8000
      - hostname: db.seanpe.io
        service: http_status:404
      # Grafana, private: the whole host behind Cloudflare Access (Sean only).
      - hostname: grafana.seanpe.io
        service: http://grafana.apps.svc.cluster.local:80
      # Grafana, PUBLIC: same instance, no Access. Pass ONLY what a shared dashboard needs -
      # the page, its API (dashboard JSON, panel queries, annotations) and static assets.
      # Login, /api/*, the datasource proxy and "/" must 404. Verified on Grafana 13.3: the page
      # also calls /ofrep/v1/evaluate/flags and /apis/dashboard.grafana.app/; both may 404 harmlessly.
      - hostname: dashboards.seanpe.io
        path: ^/(public-dashboards/[0-9a-f]{32}$|api/public/dashboards/[0-9a-f]{32}(/|$)|public/)
        service: http://grafana.apps.svc.cluster.local:80
      - hostname: dashboards.seanpe.io
        service: http_status:404
      - service: http_status:404
